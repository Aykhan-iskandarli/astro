services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: astra-api:dev
    ports:
      - "8000:8000"
    environment:
      ASTRA_SOURCE_URL: ${ASTRA_SOURCE_URL:-https://github.com/Aykhan-iskandarli/astro}
    volumes:
      # Live code for development (editable installs point here)
      - ./packages/engine/astra_engine:/app/packages/engine/astra_engine
      - ./packages/engine/tests:/app/packages/engine/tests
      - ./apps/api/app:/app/apps/api/app
      - ./apps/api/tests:/app/apps/api/tests
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--no-access-log", "--reload",
              "--reload-dir", "/app/apps/api/app", "--reload-dir", "/app/packages/engine/astra_engine"]
